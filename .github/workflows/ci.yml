name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      # treant-gradle-plugin and treant-idea-plugin are separate Gradle builds that the
      # root `build` never reaches. Without these steps a change can break either and still
      # show a green tick — which is how the bundled compiler jar drifted two Kotlin
      # versions behind everything else without anything noticing.
      - name: Build treant-gradle-plugin
        working-directory: treant-gradle-plugin
        run: ../gradlew build

      - name: Build treant-idea-plugin
        working-directory: treant-idea-plugin
        run: ../gradlew build verifyPluginStructure

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
