name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # publishToMavenCentral, not `publish` or publishAllPublicationsToMavenCentral-
      # Repository: only this task drives the Portal deployment lifecycle. The output is
      # tee'd because it logs the deployment ids, which the verification step needs.
      - name: Publish treant-annotations and treant-compiler
        run: |
          ./gradlew :treant-annotations:publishToMavenCentral :treant-compiler:publishToMavenCentral \
            | tee -a publish.log

      - name: Publish treant-gradle-plugin
        working-directory: treant-gradle-plugin
        run: ../gradlew publishToMavenCentral | tee -a ../publish.log

      # Uploading a bundle and Central accepting it are different things. The Portal
      # validates asynchronously, so a rejected deployment — bad signature, incomplete POM,
      # duplicate version — otherwise leaves a green run; every rejection during the 1.0.1
      # release looked like a passing build.
      #
      # The plugin can wait for the verdict itself, but only when automaticRelease is true,
      # which would also publish the version immediately. Deployments are deliberately left
      # staged for a manual release, so the verdict is checked here instead.
      - name: Verify Central accepted the deployments
        env:
          CENTRAL_USER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail

          ids=$(grep -oE 'deployment id: [0-9a-f-]+' publish.log | awk '{print $3}' | sort -u)
          if [ -z "$ids" ]; then
            echo "::error::No deployment id found in the publish output"
            exit 1
          fi

          token=$(printf '%s:%s' "$CENTRAL_USER" "$CENTRAL_PASSWORD" | base64 -w0)
          failed=0

          for id in $ids; do
            # PENDING and VALIDATING are transient; poll until the Portal reaches a verdict.
            for _ in $(seq 1 30); do
              body=$(curl -sS -X POST \
                "https://central.sonatype.com/api/v1/publisher/status?id=$id" \
                -H "Authorization: Bearer $token")
              state=$(printf '%s' "$body" | jq -r '.deploymentState // "UNKNOWN"')
              case "$state" in
                VALIDATED|PUBLISHED|PUBLISHING|FAILED) break ;;
                *) sleep 10 ;;
              esac
            done

            name=$(printf '%s' "$body" | jq -r '.deploymentName // "?"')
            if [ "$state" = "FAILED" ]; then
              echo "::error::$name ($id) rejected by Maven Central: $(printf '%s' "$body" | jq -c '.errors')"
              failed=1
            else
              echo "$name ($id): $state"
            fi
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "All deployments accepted. Release them at https://central.sonatype.com/publishing/deployments"
